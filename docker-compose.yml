services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/agentforge
      SUPABASE_JWT_SECRET: your-supabase-jwt-secret
      STRIPE_SECRET_KEY: sk_test_...
    depends_on:
      - postgres